management:
  endpoints:
    web:
      exposure:
        #По умолчанию конечная точка не отображается, поэтому вам необходимо явно включить.
        #Предоставляет конечные точки как работоспособности, так и показателей.
        #Предоставляет конечную точку /actuator/refresh через HTTP.
        #Предоставляет конечную точку /actuator/health через HTTP.
        #Предоставляет конечную точку /actuator/metrics через HTTP.
        #Предоставляет конечную точку /actuator/prometheus через HTTP.
        include: refresh, health, metrics, prometheus
  endpoint:
    #http :9000/actuator/health
    health:
      #Всегда показывает подробную информацию о состоянии приложения
      show-details: always
      #Всегда показывает информацию о компонентах, используемых приложением
      show-components: always
      probes:
        #http :9000/actuator/health/readiness Когда он не готов, Kubernetes не будет отправлять трафик на экземпляр приложения.
        #http :9000/actuator/health/liveness
        #Включает поддержку зондов работоспособности
        enabled: true
      group:
        readiness:
          #Проверка готовности будет объединять состояние готовности приложения и доступность Redis
          include: readinessState, redis
  metrics:
    tags:
      #Добавляет общий тег Micrometer с именем приложения. В результате ко всем метрикам применяется метка Prometheus.
      application: ${spring.application.name}

logging:
  group:
    #Собирает несколько регистраторов в группу для применения одной и той же конфигурации.
    circuitbreaker: io.github.resilience4j, org.springframework.cloud.circuitbreaker
  level:
    #Устанавливает регистратор «информации» для Resilience4J и Spring Cloud Circuit Breaker, который легко изменить, если вам нужно отладить автоматические выключатели
    circuitbreaker: info
  pattern:
    #Включает имя приложения, идентификатор трассировки и идентификатор диапазона рядом с уровнем журнала (%5p).
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"